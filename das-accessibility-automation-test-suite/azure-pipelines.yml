            #     azurePowerShellVersion: LatestVersion    
            - task: DotNetCoreCLI@2
              displayName: 'Run ALL Accessibility Tests (Local Agent)'
              inputs:
                command: test
                projects: $(Project)
                arguments: '--no-build --configuration $(BuildConfiguration) --filter "TestCategory=$(TestCategory)" --logger "trx;LogFileName=test_results.trx"'
                testRunTitle: 'Accessibility test $(DATE_TIME)'
                publishTestResults: false

